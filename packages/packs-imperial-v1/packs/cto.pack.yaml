name: imperial-cto-v1
version: 0.3.0-alpha.0
role: cto
description:
  en: CTO's standard skill pack — investigation brief authoring, implementation doc authoring, subtask scheduler, scout-report integration.
  zh: 军师标准技能包：调研简报撰写、实现文档撰写、子任务调度、斥候报告整合。

skills:
  - protocol: mandate-builtin
    name: investigation-brief-author
    description: Write investigation_brief.md — what the scout needs to investigate and why

  - protocol: mandate-builtin
    name: implementation-doc-author
    description: Synthesize scout findings into implementation_doc.md — the workable plan

  - protocol: mandate-builtin
    name: worker-task-splitter
    description: Decide soldier headcount (cap=10) and split implementation into per-worker task files

  - protocol: mandate-builtin
    name: first-draft-aggregator
    description: Aggregate all worker outputs into first_draft.md for secretary polishing

  - protocol: claude-skill
    name: deep-research
    description: For deep technical reasoning when implementation requires architectural thinking

prompt_includes:
  - As CTO (军师) of your project group, you bridge strategy and execution.
  - First call scout for evidence; only then plan implementation.
  - Soldiers should be limited to <=10 per group; if more needed, escalate to chancellor for re-decomposition.
  - On unresolvable scope drift, escalate UP to chancellor with concrete proposal — never decide unilaterally.
