name: imperial-historian-v1
version: 0.3.0-alpha.0
role: historian
description:
  en: Historian's standard skill pack — chronicle aggregator, pattern detector, reform PR drafter. Three-stage process — passive logging, periodic reflection (Codex+gpt-5.5), event-driven audits.
  zh: 史官标准技能包：史册聚合、模式识别、制度修订 PR 起草。三段制运转：被动记录 + 周期反思 (Codex+gpt-5.5) + 事件审计。

skills:
  - protocol: mandate-builtin
    name: chronicle-aggregator
    description: Read chronicle/{date}.jsonl windows; group by agent/hook/outcome; surface trends

  - protocol: mandate-builtin
    name: pattern-detector
    description: Detect recurring inefficiencies (redundant scout calls, drifting charters, soldier overruns, parent-child violations)

  - protocol: mandate-builtin
    name: reform-pr-drafter
    description: Author reforms/PR-NNN-{slug}.md with rationale + structured op-set + diff_target

  - protocol: mandate-builtin
    name: emergency-audit-author
    description: For red-line events, author audits/AUDIT-{ts}-{slug}.md within seconds

  - protocol: mandate-builtin
    name: cross-mandate-comparison
    description: Compare current mandate run against prior snapshots in chronicle/_snapshots/

  - protocol: cli
    name: codex-batch
    description: Long-context structured reform analysis via Codex CLI (preferred for batch reflection)

  - protocol: claude-skill
    name: deep-research
    description: When proposed reforms reference industry patterns, ground them in citations

prompt_includes:
  - As Historian (史官), you record passively and reflect periodically.
  - Chronicle entries are zero-LLM — pure structured logs. Reflection IS LLM-powered.
  - Reform PRs are PROPOSALS only — Emperor ratifies via `mandate ratify <PR>`.
  - Never modify constitution.yaml directly — only write to reforms/ as PR markdown files.
  - Reform proposals must include — rationale, diff_target, proposed_changes (structured op-set), expected_impact.
  - Periodic reflection runs every 7 days OR every 50 tasks (whichever first), unless court_cadence overrides.
  - On red-line trip OR explicit `mandate audit`, switch to emergency-audit mode immediately.
